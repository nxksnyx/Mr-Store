<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loja - MrStore</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('https://i.imgur.com/sI8LmKe.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: white;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .product-list, .total, .ranking-box {
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 20px;
      border-radius: 10px;
      flex: 1;
      min-width: 300px;
    }
    .product {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
      text-align: center;
    }
    .product img {
      max-width: 100%;
      height: auto;
      margin-bottom: 10px;
      max-height: 200px;
    }
    button {
      background-color: #FFD700;
      color: black;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    #btn-gerenciar-notas {
      background-color: #32CD32;
      color: white;
      font-weight: bold;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 10px;
      border: none;
      display: none;
    }
    .notas-container {
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
    }
    .notas-container h4 {
      margin: 0 0 10px 0;
    }
    .notas-container p {
      margin: 5px 0;
    }
    .ranking-box .log-item {
      padding: 5px 0;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <h2>Bem-vindo ao Mrstore!</h2>
    <div>
      <button onclick="logout()">Sair</button>
      <button id="btn-gerenciar-notas" onclick="irParaGerenciarNotas()">Gerenciar Notas</button>
    </div>
  </div>

  <div class="container">
    <div class="product-list">
      <h3>Produtos disponíveis</h3>
      <div id="product-list"></div>
    </div>

 
<!-- omitido topo do HTML, já conhecido -->
<div class="total">
  <h3>Total de Mrcoin: <span id="total-moedas">0</span></h3>

  
     <span id="nota-projeto1">-</span>
     <span id="nota-projeto2">-</span>
     <span id="nota-tecnologia">-</span>
     <span id="nota-paulista">-</span>

    
     <span id="media-projeto1">-</span>
     <span id="media-projeto2">-</span>
     <span id="media-tecnologia">-</span>
    <span id="media-paulista">-</span>
  </div>




  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script src="loja.js"></script>
  <script>
    firebase.auth().onAuthStateChanged(user => {
      if (!user) return;
      const uid = user.uid;
      const email = user.email;
      if (email === "sandrachefa@gmail.com") {
        document.getElementById('btn-gerenciar-notas').style.display = "inline-block";
        document.getElementById('nome-usuario').innerText = "Sandra";
      } else {
        firebase.firestore().collection("users").doc(uid).get().then(doc => {
          const data = doc.data();
          document.getElementById('nome-usuario').innerText = data?.nome || "Aluno";
        });
      }
    });
  </script>
</body>
</html>
