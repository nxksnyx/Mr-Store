<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loja - MrStore</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('https://i.imgur.com/sI8LmKe.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: white;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .product-list, .total, .ranking-box {
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 20px;
      border-radius: 10px;
      flex: 1;
      min-width: 300px;
    }
    .product {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
      text-align: center;
    }
    .product img {
      max-width: 100%;
      height: auto;
      margin-bottom: 10px;
      max-height: 200px;
    }
    button {
      background-color: #FFD700;
      color: black;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    #btn-gerenciar-notas {
      background-color: #32CD32;
      color: white;
      display: none;
    }
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr));
      gap: 8px;
    }
    .notes-grid strong {
      color: #FFD700;
    }
    .ranking-box .log-item {
      padding: 5px 0;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="user-info">
      <h2>Bem-vindo ao MrStore, <span id="nome-usuario">Aluno</span>!</h2>
      <button id="btn-gerenciar-notas" onclick="irParaGerenciarNotas()">Gerenciar Notas</button>
    </div>
    <button onclick="logout()">Sair</button>
  </div>

  <div class="container">
    <div class="product-list">
      <h3>Produtos disponíveis</h3>
      <div id="product-list"></div>
    </div>

    <div class="total">
      <h3>Total de Mrcoin: <span id="total-moedas">0</span></h3>
      <h4>Suas notas</h4>
      <div class="notes-grid">
        <div><strong>Projeto 1:</strong> <span id="nota-projeto1">-</span></div>
        <div><strong>Projeto 2:</strong> <span id="nota-projeto2">-</span></div>
        <div><strong>Tecnologia:</strong> <span id="nota-tecnologia">-</span></div>
        <div><strong>Paulista:</strong> <span id="nota-paulista">-</span></div>
      </div>

      <h4>Médias da sala</h4>
      <div class="notes-grid">
        <div><strong>Projeto 1:</strong> <span id="media-projeto1">-</span></div>
        <div><strong>Projeto 2:</strong> <span id="media-projeto2">-</span></div>
        <div><strong>Tecnologia:</strong> <span id="media-tecnologia">-</span></div>
        <div><strong>Paulista:</strong> <span id="media-paulista">-</span></div>
      </div>
    </div>

    <div class="ranking-box">
      <h3>Ranking da Semana</h3>
      <h4>Alunos</h4>
      <div id="ranking-semana-alunos"></div>
      <h4>Salas</h4>
      <div id="ranking-semana-salas"></div>

      <h3>Ranking do Mês</h3>
      <h4>Alunos</h4>
      <div id="ranking-mes-alunos"></div>
      <h4>Salas</h4>
      <div id="ranking-mes-salas"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="loja.js"></script>
</body>
</html>
