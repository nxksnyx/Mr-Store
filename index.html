<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MrStore - Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('https://i.imgur.com/sI8LmKe.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
    }
    .header {
      text-align: center;
    }
    .form-container {
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 300px;
    }
    input {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      background-color: #FFD700;
      color: black;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Bem-vindo à MrStore!</h1>
    <img src="https://imgur.com/uuW1flJ.jpg" alt="Logo" width="150" />
  </div>

  <div class="form-container">
    <h2>Login</h2>
    <input type="text" id="identificador" placeholder="RA ou E-mail" />
    <input type="password" id="senha" placeholder="Senha (se for e-mail)" />
    <button onclick="processarAuth()">Entrar</button>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
    // 🔧 Configuração Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBFiGU-blNt7XFO9cjYPoWaPP-c5EEItfc",
      authDomain: "mrstore-d429f.firebaseapp.com",
      projectId: "mrstore-d429f",
      storageBucket: "mrstore-d429f.appspot.com",
      messagingSenderId: "310913725702",
      appId: "1:310913725702:web:22775b2fa034b0697e1a87"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // 🔹 Função de login
    async function processarAuth() {
      const identificador = document.getElementById('identificador').value.trim().toLowerCase();
      const senha = document.getElementById('senha').value.trim();

      if (!identificador) {
        alert("Digite seu RA ou e-mail.");
        return;
      }

      // Verifica se é só número (RA)
      const isNumero = /^\d+$/.test(identificador);

      try {
        // 🔸 Se for RA (só números)
        if (isNumero) {
          const docRef = db.collection("usuariosSemSenha").doc(identificador);
          const docSnap = await docRef.get();

          if (docSnap.exists) {
            localStorage.setItem("usuarioLogado", identificador);
            window.location.href = "loja.html";
            return;
          } else {
            alert("RA não encontrado no sistema.");
            return;
          }
        }

        // 🔸 Se for admin
        if (identificador === "sandrachefa@gmail.com") {
          if (!senha) {
            alert("Digite a senha da admin.");
            return;
          }

          await auth.signInWithEmailAndPassword(identificador, senha);
          localStorage.setItem("usuarioLogado", identificador);
          window.location.href = "admin.html";
          return;
        }

        // 🔸 Se for e-mail normal
        if (identificador.includes("@")) {
          if (!senha) {
            alert("Digite a senha.");
            return;
          }

          await auth.signInWithEmailAndPassword(identificador, senha);
          localStorage.setItem("usuarioLogado", identificador);
          window.location.href = "loja.html";
          return;
        }

        alert("Digite um e-mail válido ou RA numérico.");
      } catch (err) {
        console.error("Erro no login:", err);
        alert("Erro no login: " + err.message);
      }
    }

    // 🔹 Pressionar Enter também faz login
    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        processarAuth();
      }
    });
  </script>
</body>
</html>
