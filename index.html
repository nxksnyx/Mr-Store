<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MrStore - Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('https://i.imgur.com/sI8LmKe.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
    }
    .header { text-align: center; }
    .form-container {
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 300px;
    }
    input {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      background-color: #FFD700;
      color: black;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    .switch {
      margin-top: 10px;
      color: #fff;
      text-align: center;
      cursor: pointer;
      text-decoration: underline;
    }
    #register-box { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Bem-vindo à MrStore!</h1>
    <img src="https://imgur.com/uuW1flJ.jpg" alt="Logo" width="150" />
  </div>

  <!-- Login -->
  <div class="form-container" id="login-box">
    <h2>Login</h2>
    <input type="text" id="identificador" placeholder="RA ou E-mail" />
    <input type="password" id="senha" placeholder="Senha (se for e-mail)" />
    <button onclick="processarAuth()">Entrar</button>
    <p class="switch" onclick="mostrarRegistro()">Criar uma conta</p>
  </div>

  <!-- Registro -->
  <div class="form-container" id="register-box">
    <h2>Criar Conta</h2>
    <input type="text" id="nomeCadastro" placeholder="Nome completo" />
    <input type="email" id="emailCadastro" placeholder="E-mail (ex: exemplo@gmail.com)" />
    <input type="password" id="senhaCadastro" placeholder="Senha" />
    <button onclick="criarConta()">Cadastrar</button>
    <p class="switch" onclick="mostrarLogin()">Já tem conta? Fazer login</p>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
    // 🔧 Configuração Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBFiGU-blNt7XFO9cjYPoWaPP-c5EEItfc",
      authDomain: "mrstore-d429f.firebaseapp.com",
      projectId: "mrstore-d429f",
      storageBucket: "mrstore-d429f.appspot.com",
      messagingSenderId: "310913725702",
      appId: "1:310913725702:web:22775b2fa034b0697e1a87"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Alternar entre login e registro
    function mostrarRegistro() {
      document.getElementById("login-box").style.display = "none";
      document.getElementById("register-box").style.display = "flex";
    }
    function mostrarLogin() {
      document.getElementById("register-box").style.display = "none";
      document.getElementById("login-box").style.display = "flex";
    }

    // 🔹 Login
    async function processarAuth() {
      const identificador = document.getElementById('identificador').value.trim().toLowerCase();
      const senha = document.getElementById('senha').value.trim();

      if (!identificador) return alert("Digite seu RA ou e-mail.");

      const isNumero = /^\d+$/.test(identificador);

      try {
        if (isNumero) {
          const doc = await db.collection("usuariosSemSenha").doc(identificador).get();
          if (doc.exists) {
            localStorage.setItem("usuarioLogado", identificador);
            window.location.href = "loja.html";
          } else {
            alert("RA não encontrado.");
          }
          return;
        }

        if (!senha) return alert("Digite a senha.");

        const cred = await auth.signInWithEmailAndPassword(identificador, senha);
        localStorage.setItem("usuarioLogado", cred.user.email);
        window.location.href = "loja.html";
      } catch (err) {
        alert("Erro no login: " + err.message);
      }
    }

    // 🔹 Criar Conta
    async function criarConta() {
      const nome = document.getElementById("nomeCadastro").value.trim();
      const email = document.getElementById("emailCadastro").value.trim().toLowerCase();
      const senha = document.getElementById("senhaCadastro").value.trim();

      if (!nome || !email || !senha) {
        alert("Preencha todos os campos.");
        return;
      }

      try {
        // Cria usuário no Firebase Auth
        const cred = await auth.createUserWithEmailAndPassword(email, senha);
        const uid = cred.user.uid;

        // Adiciona no Firestore
        await db.collection("users").doc(uid).set({
          email: email,
          nome: nome,
          moedas: 80,
          paulista: 6,
          projeto1: 0,
          projeto2: 5,
          ra: ra,
          sala: "",
          tecnologia: 5
        });

        alert("Conta criada com sucesso!");
        localStorage.setItem("usuarioLogado", email);
        window.location.href = "loja.html";
      } catch (erro) {
        console.error(erro);
        alert("Erro ao criar conta: " + erro.message);
      }
    }
  </script>
</body>
</html>
