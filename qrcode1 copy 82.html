<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parabéns!</title>
<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0a0f1c, #162239);
    color: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }

  .card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    animation: aparecer 1s ease-out forwards;
  }

  @keyframes aparecer {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: 26px;
    color: #6ee7b7;
    margin-bottom: 10px;
  }

  p {
    font-size: 18px;
    color: #cbd5e1;
  }

  .valor {
    font-size: 28px;
    color: #3b82f6;
    font-weight: 700;
    margin-top: 12px;
    animation: brilho 1.5s infinite alternate;
  }

  @keyframes brilho {
    from { text-shadow: 0 0 6px #3b82f6; }
    to { text-shadow: 0 0 16px #6ee7b7; }
  }

  footer {
    margin-top: 20px;
    font-size: 13px;
    color: #9aa6b2;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🎉 Parabéns! 🎉</h1>
    <p>Você ganhou:</p>
    <div class="valor">50 MrCoins</div>
    <footer>Use seu prêmio agora na MrStore!</footer>
  </div>
</body>
</html>
