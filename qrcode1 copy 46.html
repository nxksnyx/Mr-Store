<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conta de Acesso</title>
<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0a0f1c, #162239);
    color: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 30px;
    width: 320px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
  }
  h1 {
    margin-top: 0;
    font-size: 22px;
    color: #6ee7b7;
  }
  .info {
    margin: 18px 0;
    background: rgba(255,255,255,0.07);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .info span {
    font-weight: 500;
  }
  button {
    background: linear-gradient(90deg, #6ee7b7, #3b82f6);
    border: none;
    color: #0b1220;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover {
    opacity: 0.9;
  }
  .qr {
    margin-top: 25px;
    background: white;
    border-radius: 10px;
    padding: 8px;
    display: inline-block;
  }
  footer {
    margin-top: 15px;
    font-size: 12px;
    color: #9aa6b2;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Conta de Acesso</h1>

    <div class="info">
      <span id="user">Mrstore46@gmail.com</span>
      <button onclick="copiar('user')">Copiar</button>
    </div>

    <div class="info">
      <span id="pass">Mr12345@</span>
      <button onclick="copiar('pass')">Copiar</button>
    </div>


    <footer>Toque em copiar para salvar os dados</footer>
  </div>

  <script>
    const usuario = "usuario123";
    const senha = "senha456";

    // gera QR com as infos (você pode mudar o conteúdo do QR aqui)
    const qrTexto = `Usuário: ${usuario}\nSenha: ${senha}`;
    document.getElementById("qrimg").src = 
      `https://chart.googleapis.com/chart?cht=qr&chs=200x200&chl=${encodeURIComponent(qrTexto)}`;

    function copiar(id) {
      const texto = document.getElementById(id).innerText;
      navigator.clipboard.writeText(texto).then(() => {
        const botao = event.target;
        botao.textContent = "Copiado!";
        setTimeout(() => botao.textContent = "Copiar", 1500);
      });
    }
  </script>
</body>
</html>
